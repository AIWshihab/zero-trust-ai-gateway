<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zero Trust AI Gateway</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:    #08080a;
      --bg-1:  #0d0f14;
      --bg-2:  #111420;
      --border: rgba(255,255,255,.08);
      --b2:    rgba(255,255,255,.13);
      --cyan:  #00d4ff;
      --green: #22d3a0;
      --amber: #f5a623;
      --red:   #ff4d6d;
      --text:  #edf2ff;
      --muted: #7c8499;
      --mono:  'JetBrains Mono', ui-monospace, monospace;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 380px; background: var(--bg); color: var(--text); }
    main { padding: 14px; display: grid; gap: 10px; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { font-size: 13px; font-weight: 700; color: var(--cyan); font-family: var(--mono); }
    .brand span { color: var(--muted); font-weight: 400; }
    .status-pill {
      display: inline-flex; gap: 6px; align-items: center;
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--b2); background: var(--bg-2); color: var(--muted);
    }
    .status-pill.connected { color: var(--green); border-color: rgba(34,211,160,.3); background: rgba(34,211,160,.06); }
    .status-pill.blocked-state { color: var(--amber); border-color: rgba(245,166,35,.3); background: rgba(245,166,35,.06); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .dot.live { animation: pulse 1.8s ease-in-out infinite; }

    /* Card */
    .card {
      border: 1px solid var(--border); border-radius: 9px;
      background: var(--bg-1); padding: 12px;
      display: grid; gap: 8px;
    }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .card-title::before { content: '// '; color: var(--cyan); font-family: var(--mono); }

    /* Device info grid */
    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-cell { display: grid; gap: 2px; }
    .info-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .info-value { font-size: 13px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
    .info-value.mono { font-family: var(--mono); font-size: 12px; color: var(--cyan); }

    /* Stats bar */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-cell { border: 1px solid var(--border); border-radius: 7px; padding: 8px; text-align: center; background: var(--bg-2); }
    .stat-num { font-size: 20px; font-weight: 800; }
    .stat-num.allow { color: var(--green); }
    .stat-num.block { color: var(--red); }
    .stat-num.challenge { color: var(--amber); }
    .stat-label { font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 1px; }

    /* Decision feed */
    .decision-feed { display: grid; gap: 4px; max-height: 130px; overflow-y: auto; }
    .decision-feed::-webkit-scrollbar { width: 4px; }
    .decision-feed::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 99px; }
    .decision-row {
      display: grid; grid-template-columns: 7px 1fr auto;
      gap: 7px; align-items: center;
      padding: 6px 8px; border-radius: 6px; background: var(--bg-2);
      font-size: 11px; border: 1px solid var(--border);
    }
    .ddot { width: 7px; height: 7px; border-radius: 50%; }
    .ddot.allow { background: var(--green); }
    .ddot.block { background: var(--red); }
    .ddot.challenge { background: var(--amber); }
    .dec-label { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .dec-label.allow { color: var(--green); background: rgba(34,211,160,.12); border: 1px solid rgba(34,211,160,.25); }
    .dec-label.block { color: var(--red); background: rgba(255,77,109,.12); border: 1px solid rgba(255,77,109,.25); }
    .dec-label.challenge { color: var(--amber); background: rgba(245,166,35,.12); border: 1px solid rgba(245,166,35,.25); }
    .dec-url { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }

    /* Connect form */
    label { display: grid; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--b2); border-radius: 7px;
      background: var(--bg-2); color: var(--text);
      padding: 8px 10px; font: inherit; font-size: 13px; outline: none;
      transition: border-color .15s;
    }
    input:focus, textarea:focus { border-color: rgba(0,212,255,.4); }
    textarea { min-height: 72px; resize: vertical; }

    /* Buttons */
    .btn { border: 1px solid var(--b2); border-radius: 7px; padding: 8px 12px; background: var(--bg-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s; width: 100%; }
    .btn:hover { border-color: var(--cyan); }
    .btn.primary { background: var(--cyan); color: #000; border-color: var(--cyan); }
    .btn.primary:hover { background: #00bde8; }
    .btn.danger { border-color: rgba(255,77,109,.3); color: var(--red); background: rgba(255,77,109,.06); }
    .btn.danger:hover { background: rgba(255,77,109,.12); }
    .btn-row { display: flex; gap: 7px; }
    .btn-row .btn { flex: 1; }

    /* Sections */
    .section-toggle { font-size: 11px; color: var(--muted); cursor: pointer; text-align: center; padding: 4px; transition: color .15s; }
    .section-toggle:hover { color: var(--cyan); }
    .hidden { display: none !important; }
    .muted { color: var(--muted); font-size: 12px; }
    pre { white-space: pre-wrap; margin: 0; color: var(--muted); font: inherit; font-size: 12px; line-height: 1.5; }
    .decision-out { padding: 8px; border-radius: 7px; background: var(--bg-2); border: 1px solid var(--border); min-height: 32px; }
    .dec { font-weight: 800; letter-spacing: .06em; }
    .dec.allow { color: var(--green); }
    .dec.block { color: var(--red); }
    .dec.challenge { color: var(--amber); }
  </style>
</head>
<body>
<main>
  <!-- Header -->
  <div class="header">
    <div class="brand">ZT <span>// Gateway</span></div>
    <div id="statusPill" class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Checking...</span></div>
  </div>

  <!-- Device card (shown when connected) -->
  <div id="deviceCard" class="card hidden">
    <div class="card-title">Device</div>
    <div class="device-grid">
      <div class="info-cell">
        <span class="info-label">Device ID</span>
        <span id="deviceIdVal" class="info-value mono">—</span>
      </div>
      <div class="info-cell">
        <span class="info-label">Browser</span>
        <span id="browserVal" class="info-value">—</span>
      </div>
      <div class="info-cell">
        <span class="info-label">Gateway</span>
        <span id="gatewayVal" class="info-value mono" style="font-size:11px">—</span>
      </div>
      <div class="info-cell">
        <span class="info-label">Intercept</span>
        <span id="interceptVal" class="info-value" style="color:var(--green)">Active</span>
      </div>
    </div>
  </div>

  <!-- Interception stats (shown when connected) -->
  <div id="statsCard" class="card hidden">
    <div class="card-title">AI Requests Intercepted</div>
    <div class="stats-row">
      <div class="stat-cell">
        <div id="statAllowed" class="stat-num allow">0</div>
        <div class="stat-label">Allowed</div>
      </div>
      <div class="stat-cell">
        <div id="statBlocked" class="stat-num block">0</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="stat-cell">
        <div id="statChallenged" class="stat-num challenge">0</div>
        <div class="stat-label">Challenged</div>
      </div>
    </div>
  </div>

  <!-- Recent decisions feed -->
  <div id="feedCard" class="card hidden">
    <div class="card-title">Recent Decisions</div>
    <div id="decisionFeed" class="decision-feed">
      <div class="feed-empty">No intercepted requests yet.</div>
    </div>
  </div>

  <!-- Connect form (shown when disconnected) -->
  <div id="connectCard" class="card">
    <div class="card-title">Connect to Gateway</div>
    <label>Setup / Connect URL
      <input id="connectUrl" placeholder="Paste dashboard connect URL" />
    </label>
    <label>Gateway API URL
      <input id="gatewayUrl" placeholder="http://localhost:8000" />
    </label>
    <label>Pairing Token
      <input id="pairingToken" placeholder="zta_pair_..." />
    </label>
    <input id="setupSessionId" type="hidden" />
    <label>Device Label
      <input id="deviceLabel" placeholder="Work browser" />
    </label>
    <button id="connectBtn" class="btn primary">Connect</button>
  </div>

  <!-- Disconnect (shown when connected) -->
  <div id="disconnectRow" class="hidden">
    <button id="disconnectBtn" class="btn danger">Disconnect</button>
  </div>

  <!-- Manual prompt section (toggle) -->
  <div id="promptToggle" class="section-toggle hidden">▾ Send test prompt through gateway</div>
  <div id="promptCard" class="card hidden">
    <div class="card-title">Test Prompt</div>
    <label>Model ID <input id="modelId" type="number" min="1" value="1" /></label>
    <label>Prompt <textarea id="prompt" placeholder="Ask through the protected gateway"></textarea></label>
    <button id="sendBtn" class="btn primary">Send via Gateway</button>
    <div id="decisionLine" class="decision-out muted">No decision yet.</div>
    <pre id="output"></pre>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
