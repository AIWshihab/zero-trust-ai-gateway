<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zero Trust AI Gateway</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { width: 370px; margin: 0; color: #e8f2ff; background: #07101f; }
    main { padding: 14px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    label { display: grid; gap: 6px; color: #9fb0c7; font-size: 12px; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(103,232,249,.24);
      border-radius: 10px;
      background: rgba(2,6,23,.7);
      color: #e8f2ff;
      padding: 9px;
      font: inherit;
    }
    textarea { min-height: 82px; resize: vertical; }
    button {
      border: 1px solid rgba(103,232,249,.35);
      border-radius: 10px;
      padding: 9px 10px;
      background: rgba(255,255,255,.07);
      color: #e8f2ff;
      font-weight: 750;
      cursor: pointer;
    }
    button.primary { color: #031018; background: linear-gradient(135deg, #a7f3d0, #67e8f9 55%, #60a5fa); }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .card {
      border: 1px solid rgba(125,211,252,.18);
      border-radius: 14px;
      background: rgba(15,23,42,.68);
      padding: 11px;
      display: grid;
      gap: 8px;
    }
    .muted { color: #9fb0c7; font-size: 12px; line-height: 1.45; }
    .status { display: inline-flex; gap: 7px; align-items: center; color: #a7f3d0; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .dot.off { background: #fb7185; }
    .decision { font-weight: 900; letter-spacing: .08em; }
    .allow { color: #34d399; }
    .challenge { color: #fbbf24; }
    .block { color: #fb7185; }
    pre { white-space: pre-wrap; margin: 0; color: #cbd5e1; font: inherit; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Zero Trust AI Gateway</h1>
      <div class="status"><span id="statusDot" class="dot off"></span><span id="statusText">Not connected</span></div>
    </div>

    <section id="connectCard" class="card">
      <strong>Connect to Zero Trust Gateway</strong>
      <label>Setup / Connect URL <input id="connectUrl" placeholder="Paste dashboard connect URL" /></label>
      <label>Gateway API URL <input id="gatewayUrl" placeholder="http://localhost:8000" /></label>
      <label>Pairing Token <input id="pairingToken" placeholder="zta_pair_..." /></label>
      <input id="setupSessionId" type="hidden" />
      <label>Device Label <input id="deviceLabel" placeholder="Work browser" /></label>
      <button id="connectBtn" class="primary">Connect</button>
      <button id="disconnectBtn">Disconnect</button>
    </section>

    <section class="card">
      <div class="row">
        <label>Model ID <input id="modelId" type="number" min="1" value="1" /></label>
      </div>
      <label>Prompt <textarea id="prompt" placeholder="Ask through the protected gateway"></textarea></label>
      <button id="sendBtn" class="primary">Send Prompt</button>
    </section>

    <section class="card">
      <div id="decisionLine" class="muted">No decision yet.</div>
      <pre id="output"></pre>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
